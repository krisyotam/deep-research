image: alpine/edge
secrets:
  - stargate_ssh
tasks:
  - deploy: |
      ssh -o StrictHostKeyChecking=no -p 2222 krisyotam@73.50.72.176 '
        set -eu
        cd ~/deep-research
        git fetch --quiet origin
        git reset --hard origin/master
